# PÉLDA – NE commitold valódi jelszóval!
# Egyszerűbb létrehozni paranccsal (lásd README):
#   kubectl -n pod-manager create secret generic pod-manager-auth \
#     --from-literal=admin="$(openssl passwd -6 'ErosJelszo')"
#
# Formátum (haproxytech/kubernetes-ingress): kulcs = felhasználónév,
# érték = crypt(3) hash (pl. SHA-512: openssl passwd -6).
apiVersion: v1
kind: Secret
metadata:
  name: pod-manager-auth
  namespace: pod-manager
type: Opaque
stringData:
  admin: "<openssl passwd -6 kimenete>"
